# GitHub Pages deploy for the user site aj8uppal.github.io.
#
# Publishes on every push to master, and can also be sent by hand from the
# Actions tab. It was dispatch-only until September 2026; to go back to that,
# remove the `push:` block under `on:` below. Nothing else needs to change.
#
# Pages must also be switched to "GitHub Actions" as its source in
# Settings > Pages, once. Until then this workflow will fail at the
# configure-pages step, which is the intended safe default.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Catch direct Fly releases and rollbacks, even outside Voidreach's deploy command.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        name: Check the live Voidreach release
        run: node scripts/sync-voidreach.mjs --check

  build:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued deploys must not republish an older portfolio checkout.
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test release verification
        run: node --test scripts/sync-voidreach.test.mjs

      - name: Download the Pages artifact from the healthy Fly release
        run: node scripts/sync-voidreach.mjs

      - name: Lint and typecheck
        run: npm run lint

      # Runs `astro check` first, so a type error fails the deploy.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify both public hosts and every Pages file
        run: node scripts/sync-voidreach.mjs --verify
